<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#0D1B2A" />
  <meta name="description" content="Recountix — smart recovery and receivables management." />
  <link rel="manifest" href="manifest.json" />
  <title>Sign in | Recountix</title>
  <meta name="color-scheme" content="light only" />
  <meta name="supported-color-schemes" content="light" />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Outfit:wght@500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css" />

  <style>
    /* =====================================================
       Recountix — Login
       Palette (from brand reference):
       0D1B2A  darkest navy   |  1B3A6B  navy
       3D5A80  steel blue     |  6B8CAE  dusty blue
       A8C5E0  soft blue      |  CDE1F2  pale blue
       E8F1FA  lightest blue
       ===================================================== */
    :root{
      --navy-900:#0D1B2A;
      --navy-700:#1B3A6B;
      --steel-600:#3D5A80;
      --dusty-400:#6B8CAE;
      --soft-300:#A8C5E0;
      --pale-200:#CDE1F2;
      --pale-100:#E8F1FA;
      --ink:#0D1B2A;          /* body text — high contrast */
      --ink-soft:#3E5169;     /* secondary text — still readable */
      --card:#ffffff;
      --shadow: 0 30px 70px rgba(13,27,42,.16);
      --shadow-sm: 0 8px 24px rgba(13,27,42,.08);
    }
    *{ box-sizing:border-box; }
    html{ color-scheme: light only; }
    html,body{ height:100%; }
    body{
      color-scheme: light only;
      margin:0;
      font-family:'Inter', system-ui, sans-serif;
      color:var(--ink);
      background:
        radial-gradient(1100px 500px at 12% -8%, rgba(168,197,224,.55), transparent 60%),
        radial-gradient(900px 500px at 105% 108%, rgba(61,90,128,.35), transparent 55%),
        linear-gradient(160deg, var(--pale-100) 0%, var(--pale-200) 55%, var(--soft-300) 100%);
      min-height:100vh;
      display:flex;
      align-items:center;
      justify-content:center;
      padding:24px;
      position:relative;
      overflow:hidden;
    }
    .font-display{ font-family:'Outfit', sans-serif; }

    /* soft decorative corner shapes — echoes the ribbon/floral reference art */
    body::before, body::after{
      content:"";
      position:fixed;
      border-radius:50%;
      filter:blur(2px);
      pointer-events:none;
      opacity:.5;
    }
    body::before{
      width:340px; height:340px; top:-120px; left:-120px;
      background: radial-gradient(circle at 30% 30%, var(--soft-300), transparent 70%);
    }
    body::after{
      width:380px; height:380px; bottom:-140px; right:-140px;
      background: radial-gradient(circle at 70% 70%, var(--dusty-400), transparent 70%);
    }

    .login-wrap{ position:relative; z-index:2; width:100%; max-width:428px; }

    .brand-row{
      display:flex; align-items:center; gap:12px;
      justify-content:center;
      margin-bottom:22px;
    }
    .brand-mark{
      width:46px; height:46px; border-radius:14px;
      background:linear-gradient(135deg, var(--navy-700), var(--steel-600));
      display:flex; align-items:center; justify-content:center;
      box-shadow: 0 10px 24px rgba(27,58,107,.35);
      flex:0 0 auto;
    }
    .brand-mark img{ width:28px; height:28px; object-fit:contain; filter:brightness(0) invert(1); }
    .brand-text{ text-align:left; }
    .brand-text .name{
      font-family:'Outfit',sans-serif; font-weight:700; font-size:15px;
      letter-spacing:.06em; color:var(--navy-900);
    }
    .brand-text .tag{
      font-size:11px; font-weight:600; letter-spacing:.16em; text-transform:uppercase;
      color:var(--steel-600);
    }

    .card{
      background:var(--card);
      border-radius:24px;
      box-shadow:var(--shadow);
      border:1px solid rgba(168,197,224,.45);
      padding:38px 34px 30px;
    }

    .icon-badge{
      width:44px; height:44px; border-radius:14px;
      background:var(--pale-100);
      color:var(--navy-700);
      display:flex; align-items:center; justify-content:center;
      font-size:17px;
      margin-bottom:18px;
    }
    h1.title{
      font-family:'Outfit',sans-serif;
      font-size:26px; font-weight:700;
      color:var(--navy-900);
      margin:0 0 6px;
      letter-spacing:-.01em;
    }
    p.subtitle{
      font-size:13.5px; line-height:1.6;
      color:var(--ink-soft);
      margin:0 0 26px;
    }

    label{
      display:block; font-size:13px; font-weight:600;
      color:var(--navy-900); margin-bottom:7px;
    }
    label .req{ color:var(--steel-600); }

    .field-wrap{ position:relative; margin-bottom:18px; }
    .field-wrap i.leading{
      position:absolute; left:14px; top:50%; transform:translateY(-50%);
      color:var(--dusty-400); font-size:14px; pointer-events:none;
    }
    .field-wrap input{
      color-scheme: light;
      width:100%; height:48px;
      border:1.5px solid var(--pale-200);
      background:var(--pale-100);
      border-radius:14px;
      padding:0 14px 0 42px;
      font-size:14px;
      color:var(--ink);
      outline:none;
      transition:border-color .15s, box-shadow .15s, background .15s;
    }
    .field-wrap input::placeholder{ color:#7C93A8; }
    .field-wrap input:focus{
      border-color:var(--steel-600);
      background:#fff;
      box-shadow:0 0 0 4px rgba(61,90,128,.14);
    }
    .field-wrap button.eye-btn{
      position:absolute; right:6px; top:50%; transform:translateY(-50%);
      width:34px; height:34px; border:none; background:transparent;
      color:var(--dusty-400); border-radius:10px; cursor:pointer;
      display:flex; align-items:center; justify-content:center; font-size:14px;
    }
    .field-wrap button.eye-btn:hover{ background:var(--pale-100); color:var(--navy-700); }

    .row-between{
      display:flex; align-items:center; justify-content:space-between;
      gap:10px; margin:-6px 0 20px;
    }
    .remember{
      display:flex; align-items:center; gap:8px;
      font-size:13px; color:var(--ink-soft); cursor:pointer;
    }
    .remember input{ width:15px; height:15px; accent-color:var(--navy-700); }
    .forgot-link{
      font-size:12.5px; font-weight:700; color:var(--navy-700);
      background:none; border:none; cursor:pointer; padding:0;
    }
    .forgot-link:hover{ color:var(--steel-600); text-decoration:underline; }

    .btn-primary{
      width:100%; height:49px; border:none; border-radius:14px;
      background:linear-gradient(135deg, var(--navy-700), var(--steel-600));
      color:#ffffff; font-size:14.5px; font-weight:700;
      display:flex; align-items:center; justify-content:center; gap:8px;
      cursor:pointer;
      box-shadow:0 14px 30px rgba(27,58,107,.32);
      transition:transform .15s, box-shadow .15s;
    }
    .btn-primary:hover{ transform:translateY(-1px); box-shadow:0 18px 38px rgba(27,58,107,.4); }
    .btn-primary:active{ transform:translateY(0); }

    .secure-note{
      display:flex; align-items:center; justify-content:center; gap:6px;
      margin-top:16px; font-size:11.5px; color:var(--ink-soft);
    }
    .secure-note i{ color:#3F9A5C; }

    .footer-note{
      text-align:center; margin-top:22px;
      font-size:11.5px; color:var(--steel-600);
    }

    .back-link{
      display:inline-flex; align-items:center; gap:8px;
      font-size:13px; font-weight:600; color:var(--ink-soft);
      background:none; border:none; cursor:pointer; margin-bottom:18px; padding:0;
    }
    .back-link:hover{ color:var(--navy-900); }

    #forgotModal{ display:none; }
    #forgotModal.show{ display:block; }

    @media (max-width:420px){
      .card{ padding:30px 22px 26px; border-radius:20px; }
      h1.title{ font-size:22px; }
    }
  
    /* Recountix brand refinement */
    :root{ --navy-900:#083D35; --navy-700:#0B5D4F; --steel-600:#0F766E; --dusty-400:#399889; --soft-300:#A7E3D3; --pale-200:#D5F2EA; --pale-100:#F0FBF7; --ink:#123C36; --ink-soft:#58736D; }
    .recountix-login-brand{margin-bottom:20px;}
    .recountix-login-brand img{display:block;width:min(100%,330px);height:auto;max-height:116px;object-fit:contain;margin:0 auto;}
    .btn-primary{background:linear-gradient(135deg,#0B5D4F,#12A77A);box-shadow:0 14px 30px rgba(11,93,79,.25);}
    .btn-primary:hover{box-shadow:0 18px 38px rgba(11,93,79,.34);}
    .remember input{accent-color:#0B5D4F;}
    body{background:radial-gradient(1100px 500px at 12% -8%,rgba(167,227,211,.55),transparent 60%),radial-gradient(900px 500px at 105% 108%,rgba(15,118,110,.28),transparent 55%),linear-gradient(160deg,#F0FBF7 0%,#D5F2EA 58%,#A7E3D3 100%);}
  </style>
<link rel="stylesheet" href="css/final-suite.css?v=professional-v4">
</head>
<body>

  <div class="login-wrap">
    <div class="brand-row recountix-login-brand">
      <img src="assets/recountix-logo.png" alt="Recountix — Beyond What’s Due." />
    </div>

    <div class="card login-card">

      <div id="loginView">
        <div class="icon-badge"><i class="fa-solid fa-lock"></i></div>
        <h1 class="title">Welcome back</h1>
        <p class="subtitle">Sign in to continue to your recovery workspace.</p>

        <form id="loginForm" autocomplete="on" onsubmit="event.preventDefault(); login();">
          <div>
            <label for="username">Username <span class="req">*</span></label>
            <div class="field-wrap">
              <i class="fa-regular fa-user leading"></i>
              <input id="username" type="text" autocomplete="username" placeholder="Enter your username" />
            </div>
          </div>

          <div>
            <label for="password">Password <span class="req">*</span></label>
            <div class="field-wrap">
              <i class="fa-solid fa-key leading"></i>
              <input id="password" type="password" autocomplete="current-password" placeholder="Enter your password" style="padding-right:44px;" />
              <button id="togglePassword" type="button" class="eye-btn" aria-label="Show password">
                <i class="fa-regular fa-eye"></i>
              </button>
            </div>
          </div>

          <div class="row-between">
            <label class="remember">
              <input id="rememberMe" type="checkbox" />
              Remember me
            </label>
            <button type="button" class="forgot-link" onclick="openForgotPassword()">Forgot password?</button>
          </div>

          <button id="loginBtn" type="submit" class="btn-primary">
            <span>Sign In</span><i class="fa-solid fa-arrow-right" style="font-size:12px;"></i>
          </button>

          <div class="secure-note"><i class="fa-solid fa-shield-halved"></i> Secure encrypted access</div>
        </form>
      </div>

      <div id="forgotModal" class="forgot-modal">
        <button type="button" onclick="closeForgotPassword()" class="back-link">
          <i class="fa-solid fa-arrow-left"></i> Back to sign in
        </button>
        <div class="icon-badge"><i class="fa-solid fa-key"></i></div>
        <h1 class="title">Reset password</h1>
        <p class="subtitle">Verify your account and set a new password.</p>

        <div>
          <label>Username *</label>
          <div class="field-wrap"><i class="fa-regular fa-user leading"></i>
            <input id="forgotUsername" type="text" autocomplete="username" placeholder="e.g. admin" /></div>
        </div>
        <div>
          <label>Recovery Email *</label>
          <div class="field-wrap"><i class="fa-regular fa-envelope leading"></i>
            <input id="forgotEmail" type="email" autocomplete="email" placeholder="Registered recovery email" /></div>
        </div>
        <div>
          <label>New Password *</label>
          <div class="field-wrap"><i class="fa-solid fa-lock leading"></i>
            <input id="forgotNewPass" type="password" autocomplete="new-password" placeholder="New password" /></div>
        </div>
        <div>
          <label>Confirm Password *</label>
          <div class="field-wrap"><i class="fa-solid fa-lock leading"></i>
            <input id="forgotConfirmPass" type="password" autocomplete="new-password" placeholder="Confirm new password" /></div>
        </div>
        <button type="button" onclick="submitForgotPassword()" class="btn-primary" style="margin-top:6px;">
          Reset Password
        </button>
      </div>

    </div>

    <div class="footer-note">© 2026 Recountix · Beyond What’s Due.</div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/supabase.js"></script>
  <script src="js/utils.js?v=11-final"></script>
  <script src="js/db.js?v=11-final"></script>
  <script src="js/auth.js?v=rc005-ads2"></script>
  <script>
    const passwordInput = document.getElementById('password');
    const togglePassword = document.getElementById('togglePassword');
    togglePassword.addEventListener('click', function () {
      const hidden = passwordInput.type === 'password';
      passwordInput.type = hidden ? 'text' : 'password';
      this.innerHTML = hidden ? '<i class="fa-regular fa-eye-slash"></i>' : '<i class="fa-regular fa-eye"></i>';
      this.setAttribute('aria-label', hidden ? 'Hide password' : 'Show password');
    });

    window.openForgotPassword = function () {
      document.getElementById('loginView').style.display = 'none';
      const panel = document.getElementById('forgotModal');
      panel.classList.add('show');
      ['forgotUsername','forgotEmail','forgotNewPass','forgotConfirmPass'].forEach(id => document.getElementById(id).value = '');
      document.getElementById('forgotUsername').focus();
    };
    window.closeForgotPassword = function () {
      const panel = document.getElementById('forgotModal');
      panel.classList.remove('show');
      document.getElementById('loginView').style.display = 'block';
      document.getElementById('username').focus();
    };

    if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});
  </script>
<script src="js/final-suite.js?v=11-final"></script>
</body>
</html>
