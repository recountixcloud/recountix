<title>System Maintenance | Recountix</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Outfit:wght@500;600;700;800&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
<link rel="stylesheet" href="css/recountix-2027.css?v=starless-wave-1">
<link rel="stylesheet" href="css/boltise-dark.css?v=command-center-10">

<style>
body{
    margin:0;min-height:100vh;display:flex;justify-content:center;align-items:center;
    background:radial-gradient(ellipse at 20% 20%,rgba(212,175,55,0.14) 0%,transparent 50%),
        radial-gradient(ellipse at 80% 80%,rgba(212,175,55,0.06) 0%,transparent 50%),
        linear-gradient(150deg,#0A0F1D 0%,#0B1220 55%,#0D1526 100%);
    font-family:'Segoe UI',system-ui,-apple-system,sans-serif;padding:20px;
}
.card{
    width:100%;max-width:460px;background:#1A2233;border-radius:20px;padding:44px 36px;
    border:1px solid rgba(212,175,55,.16);box-shadow:0 25px 60px rgba(0,0,0,.5);
    text-align:center;color:#fff;
}
.icon{font-size:52px;color:#D4AF37;margin-bottom:18px;}
h1{font-size:22px;margin:0 0 12px;}
p{color:#9CA6B8;font-size:15px;line-height:1.6;margin:0 0 20px;white-space:pre-wrap;}
.retry-btn{
    background:linear-gradient(135deg,#D4AF37,#b8912c);color:#0A0F1D;border:none;
    padding:12px 26px;border-radius:10px;font-weight:700;cursor:pointer;font-size:14px;
}
.retry-btn:hover{opacity:.9;}
</style></head>
<body class="maintenance-screen">

<div class="card">
    <div class="icon"><i class="fa-solid fa-screwdriver-wrench"></i></div>
    <h1>System Under Maintenance</h1>
    <p id="maintMsg">Our system is currently being updated. Please try again shortly.</p>
    <button class="retry-btn" onclick="location.href='login.html'">Try Again</button>
</div>

<script>
(function(){
    var msg = sessionStorage.getItem("bk_maintenance_message");
    if (msg) document.getElementById("maintMsg").textContent = msg;
})();
</script>

<script src="js/i18n.js?v=2"></script>
</body>
</html>
