name: Security checks

on:
  pull_request:
  push:
    branches: [main, "security/**", "staging/**"]

permissions:
  contents: read

jobs:
  static-security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: JavaScript syntax
        run: |
          find frontend/js -name '*.js' -print0 | xargs -0 -n1 node --check
      - name: Frontend regression tests
        run: node tests/overall-audit.cjs
      - name: Install Playwright Chromium
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium
      - name: Browser UI regression tests
        run: |
          python3 -m http.server 8765 --directory frontend >/tmp/recountix-http.log 2>&1 &
          for attempt in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8765/login.html >/dev/null; then break; fi
            sleep 1
          done
          RECOUNTIX_TEST_URL=http://127.0.0.1:8765 node tests/layout-ui.cjs
          RECOUNTIX_TEST_URL=http://127.0.0.1:8765 node tests/user-permissions-ui.cjs
      - name: Security regression scan
        run: node scripts/security-check.mjs
      - name: Release readiness
        run: node scripts/release-check.mjs
